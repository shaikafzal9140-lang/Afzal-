<html><meta name=viewport content="width=device-width,initial-scale=1"><title>AFZAL CLIPBOARD 26</title><body style="background:#111;color:#fff;font-family:arial;margin:0;padding:10px"><h2 style="text-align:center;color:#a78bfa;margin:10px">AFZAL CLIPBOARD 26 🔥</h2><div id=g style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div><script>let d={};try{d=JSON.parse(localStorage.AFZAL||'{}')}catch{}function S(k,v){d[k]=v;localStorage.AFZAL=JSON.stringify(d)}let h='';for(let i=65;i<=90;i++){let k=String.fromCharCode(i);h+=`<div style="background:#222;padding:8px;border-radius:10px"><b style="color:#4ade80">${k}</b><textarea id="${k}" oninput="S('${k}',this.value)" style="width:100%;height:60px;background:#000;color:#fff;border:0;border-radius:6px;margin-top:4px">${d[k]||''}</textarea><button onclick="navigator.clipboard.writeText(document.getElementById('${k}').value);alert('Copied '+ '${k}')" style="width:100%;margin-top:4px;background:#7c3aed;color:#fff;border:0;padding:5px;border-radius:5px">COPY ${k}</button></div>`}document.getElementById('g').innerHTML=h</script>
