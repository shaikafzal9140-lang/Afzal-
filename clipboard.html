<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afzal AI Pro</title>
<style>
body{margin:0;font-family:sans-serif;min-height:100vh;background:linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b);padding:15px}
h1{text-align:center;color:#fff;font-size:22px}
.box{max-width:600px;margin:12px auto;background:#ffffffee;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0002}
.q{font-weight:800;padding:10px;border-radius:10px;background:linear-gradient(90deg,#60a5fa,#a78bfa);margin-bottom:8px}
.a{padding:12px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0;white-space:pre-wrap;color:#111;line-height:1.5}
.input{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;display:flex;gap:8px;box-shadow:0 -10px 20px #0002}
.input input{flex:1;padding:14px;border-radius:20px;border:2px solid #e9d5ff;outline:none}
.input button{background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;border:0;padding:12px 22px;border-radius:20px;font-weight:800}
</style>
</head>
<body>
<h1>⚡ AFZAL AI PRO - NO LIMIT</h1>
<div class="box" style="display:flex;gap:8px">🔍 <input id="s" style="flex:1;border:0;background:transparent;outline:none" placeholder="Search..." oninput="show()"></div>
<div id="list" style="max-width:600px;margin:0 auto 100px;display:flex;flex-direction:column;gap:12px"></div>
<div class="input"><input id="n" placeholder="Question likh..."><button id="btn" onclick="add()">ASK 🚀</button></div>
<script>
let a=JSON.parse(localStorage.getItem('af_ai')||'[]');
function save(){localStorage.setItem('af_ai',JSON.stringify(a));show()}
function show(){let q=document.getElementById('s').value.toLowerCase();let l=document.getElementById('list');l.innerHTML='';a.filter(x=>x.q.toLowerCase().includes(q)||x.a.toLowerCase().includes(q)).forEach((x,i)=>{l.innerHTML+=`<div class=box><div style="font-size:11px;color:#888">Q#${a.length-i} • ${x.time}</div><div class=q>❓ ${x.q}</div><div class=a>${x.a}</div><br><button onclick="navigator.clipboard.writeText(\`${x.a.replace(/`/g,'')}\`);this.innerText='Copied!'" style="background:#111;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:800">Copy Ans</button> <button onclick="a.splice(${i},1);save()" style="background:#fee2e2;color:#c00;border:0;padding:8px 14px;border-radius:8px;font-weight:800">Delete</button></div>`})}
async function getAI(q){
  try{
    let r1=await fetch('https://api.affiliateplus.xyz/api/chatbot?message='+encodeURIComponent(q)+'&botname=Afzal&ownername=Afzal');
    let j1=await r1.json();
    if(j1.message) return j1.message;
  }catch(e){}
  try{
    let r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));
    let t2=await r2.text();
    if(t2 && !t2.includes('Free limit reached') && !t2.includes('limit reached')) return t2;
    if(t2.includes('wait')){ 
      let sec = t2.match(/(\d+)\s*seconds/)?.[1] || 45;
      return "RATE_LIMIT:"+sec+":"+t2;
    }
  }catch(e){}
  return "AI thoda busy hai, 5 sec baad fir se ASK dabao!";
}
async function add(){let inp=document.getElementById('n');let btn=document.getElementById('btn');let txt=inp.value.trim();if(!txt)return;let time=new Date().toLocaleTimeString();a.unshift({q:txt,a:`🤖 AI soch raha hai...`,time:time});inp.value='';save();let ans=await getAI(txt);if(ans.startsWith("RATE_LIMIT:")){let parts=ans.split(":");let sec=parseInt(parts[1]);a[0].a=`⏳ Free AI 45 sec limit pe hai! ${sec} sec rukna hai.\n\nLekin tension nahi - 2nd AI try kar raha hu...`;save();let alt=await fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(txt)+'&format=json&pretty=1').then(r=>r.json()).then(j=>j.AbstractText||'').catch(()=> '');if(alt){a[0].a=alt;save();return;}let count=sec;let iv=setInterval(()=>{count--;a[0].a=`⏳ Wait ${count}s... ${sec} sec ke baad fir se ASK dabao. Tab tak ye raha: ${txt} ke baare me main janta hu!`;save();if(count<=0){clearInterval(iv);a[0].a=`Ab fir se ASK dabao! Limit khatam!`;save();}},1000);return;}a[0].a=ans;save();}
show();
</script>
</body>
</html>
