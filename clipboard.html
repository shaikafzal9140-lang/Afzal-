<title>AFZAL CLIPBOARD 26</title><meta name=viewport content="width=device-width,initial-scale=1"><body style="background:#111;color:#fff;font-family:sans-serif;margin:0;padding:10px"><h2 style="text-align:center;color:#a78bfa">AFZAL CLIPBOARD - 26 BOX 🔥</h2><div id=g style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div><script>let d=JSON.parse(localStorage.AFZAL_CLIP||'{}');function save(k,v){d[k]=v;localStorage.AFZAL_CLIP=JSON.stringify(d)}let h='';for(let i=65;i<=90;i++){let k=String.fromCharCode(i);h+=`<div style="background:#222;padding:8px;border-radius:10px"><b style="color:#4ade80">${k}</b><textarea id="${k}" oninput="save('${k}',this.value)" placeholder="Box ${k}..." style="width:100%;height:60px;background:#000;color:#fff;border:0;border-radius:6px;margin-top:4px;padding:4px">${d[k]||''}</textarea><div style="display:flex;gap:4px;margin-top:4px"><button onclick="navigator.clipboard.writeText(document.getElementById('${k}').value)" style="flex:1;background:#7c3aed;color:#fff;border:0;padding:4px;border-radius:4px">COPY</button><button onclick="document.getElementById('${k}').value='';save('${k}','')" style="background:#333;color:#fff;border:0;padding:4px 8px;border-radius:4px">CLEAR</button></div></div>`}document.getElementById('g').innerHTML=h</script>
