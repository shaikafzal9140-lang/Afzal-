<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASIO fx-991ES - By Afzal</title>
<style>
  body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#e8e8e8;font-family:Arial,sans-serif;padding:10px}
  .casio-body{width:360px;background:linear-gradient(180deg,#f0f0e8 0%, #d9d9cc 100%);border-radius:25px 25px 15px 15px;padding:20px 18px 25px;box-shadow:0 10px 0 #a0a090,0 20px 30px rgba(0,0,0,0.4);border:2px solid #999}
  .brand{display:flex;justify-content:space-between;align-items:center}
  .brand b{font-size:22px;letter-spacing:1px}
  .solar{width:140px;height:32px;background:#2b1a1a;border:2px solid #000;border-radius:4px;background:linear-gradient(90deg,#3a2a2a 20%,#5a3a3a 20%,#3a2a2a 40%,#5a3a3a 40%,#3a2a2a 60%,#5a3a3a 60%)}
  .screen{margin:15px 0;background:#a8b99a;border:3px solid #333;border-radius:8px;padding:10px;height:75px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 3px 6px rgba(0,0,0,0.4)}
  .screen-top{font-size:12px;text-align:right;color:#333;min-height:14px}
  .screen-main{font-size:26px;text-align:right;font-family:'Courier New',monospace;color:#111;overflow:hidden;white-space:nowrap}
  .nav-area{display:flex;justify-content:center;gap:12px;margin:12px 0}
  .nav-btn{width:48px;height:28px;background:#9aa8c0;border-radius:10px;border:1px solid #666;box-shadow:0 2px 0 #666}
  .nav-circle{width:62px;height:62px;background:#9aa8c0;border-radius:50%;border:2px solid #777;box-shadow:0 3px 0 #666}
  .btn-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
  .btn-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
  button{border:none;border-radius:8px;padding:8px 2px;font-size:11px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,0.3);transition:0.1s}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.3)}
  .btn-black{background:#2a2a2a;color:white}
  .btn-white{background:#fefefe;color:#222;border:1px solid #aaa;font-size:16px;padding:10px 2px}
  .btn-orange{background:#ff8c2a;color:white;font-size:13px}
  .btn-green{background:#e8e8e8}
  .footer{text-align:center;margin-top:15px;font-size:10px;color:#555}
  .title{text-align:center;font-weight:bold;font-size:14px;margin-bottom:5px;color:#333}
</style>
</head>
<body>
<div class="casio-body">
  <div class="brand"><b>CASIO</b><div class="solar"></div></div>
  <div class="title">fx-991ES PLUS - NATURAL-V.P.A.M. - By AFZAL</div>
  <div class="screen">
    <div class="screen-top" id="top"></div>
    <div class="screen-main" id="display">0</div>
  </div>
  <div class="nav-area">
    <div class="nav-btn"></div><div class="nav-btn"></div><div class="nav-circle"></div><div class="nav-btn"></div><div class="nav-btn"></div>
  </div>
  <div class="btn-grid">
    <button class="btn-black" onclick="press('SHIFT')">CALC</button>
    <button class="btn-black" onclick="press('∫dx')">∫dx</button>
    <button class="btn-black" onclick="press('x!')">x⁻¹</button>
    <button class="btn-black" onclick="press('log')">log□</button>
    <button class="btn-black" onclick="square()">x²</button>
    <button class="btn-black" onclick="press('sqrt(')">√</button>
    <button class="btn-black" onclick="press('(')">(-)</button>
    <button class="btn-black" onclick="press('°')">°’”</button>
    <button class="btn-black" onclick="press('hyp(')">hyp</button>
    <button class="btn-black" onclick="func('sin(')">sin</button>
    <button class="btn-black" onclick="func('cos(')">cos</button>
    <button class="btn-black" onclick="func('tan(')">tan</button>
    <button class="btn-black" onclick="press('RCL')">RCL</button>
    <button class="btn-black" onclick="press('ENG')">ENG</button>
    <button class="btn-black" onclick="press('(')">(</button>
    <button class="btn-black" onclick="press(')')">)</button>
    <button class="btn-black" onclick="press('S')">S⇔D</button>
    <button class="btn-black" onclick="press('M+')">M+</button>
  </div>
  <div class="btn-grid-5" style="margin-top:12px">
    <button class="btn-white" onclick="press('7')">7</button>
    <button class="btn-white" onclick="press('8')">8</button>
    <button class="btn-white" onclick="press('9')">9</button>
    <button class="btn-orange" onclick="del()">DEL</button>
    <button class="btn-orange" onclick="ac()">AC</button>

    <button class="btn-white" onclick="press('4')">4</button>
    <button class="btn-white" onclick="press('5')">5</button>
    <button class="btn-white" onclick="press('6')">6</button>
    <button class="btn-white" onclick="press('*')">×</button>
    <button class="btn-white" onclick="press('/')">÷</button>

    <button class="btn-white" onclick="press('1')">1</button>
    <button class="btn-white" onclick="press('2')">2</button>
    <button class="btn-white" onclick="press('3')">3</button>
    <button class="btn-white" onclick="press('+')">+</button>
    <button class="btn-white" onclick="press('-')">−</button>

    <button class="btn-white" onclick="press('0')">0</button>
    <button class="btn-white" onclick="press('.')">.</button>
    <button class="btn-white" onclick="press('*10^')">×10ˣ</button>
    <button class="btn-white" onclick="ans()">Ans</button>
    <button class="btn-white" onclick="calculate()" style="background:#d0d0d0">=</button>
  </div>
  <div class="footer">SITUATION MASTER CALCULATOR 🔥 Afzal - Live Project</div>
</div>

<script>
let exp=''; let lastAns=0;
const disp=document.getElementById('display');
const topDisp=document.getElementById('top');
function update(){ disp.textContent=exp||'0'; if(exp.length>22) disp.style.fontSize='18px'; else disp.style.fontSize='26px'; }
function press(v){
  if(v=='*10^') v='*10**';
  exp+=v; update();
}
function func(f){ exp+=f; update(); topDisp.textContent=f; }
function square(){ exp+='**2'; update(); }
function ac(){ exp=''; topDisp.textContent=''; update(); }
function del(){ exp=exp.slice(0,-1); update(); }
function ans(){ exp+=lastAns; update(); }
function calculate(){
  try{
    let e=exp.replace(/×/g,'*').replace(/÷/g,'/').replace(/√/g,'Math.sqrt').replace(/sin\(/g,'Math.sin((Math.PI/180)*').replace(/cos\(/g,'Math.cos((Math.PI/180)*').replace(/tan\(/g,'Math.tan((Math.PI/180)*').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/\^/g,'**');
    // handle sqrt(
    e=e.replace(/sqrt\(/g,'Math.sqrt(');
    if(e.includes('det(MatB)')){ topDisp.textContent='det(MatB)= 0 (Matrix Demo)'; disp.textContent='0'; return; }
    let res=eval(e);
    if(res===undefined) res=0;
    topDisp.textContent=exp+' =';
    lastAns=res;
    exp=res.toString(); update();
  }catch{ disp.textContent='Syntax Error'; exp=''; }
}
update();
</script>
</body>
</html>
