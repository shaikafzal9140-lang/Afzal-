<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afzal - Situation Master Calculator Pro</title>
<style>
body { background:#0f0f0f; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:sans-serif; margin:0; }
.box { background:#1e1e1e; padding:20px; border-radius:20px; width:300px; box-shadow:0 0 30px #00ff88; }
#display { width:100%; height:60px; background:#000; color:#00ff88; font-size:30px; text-align:right; border:none; border-radius:10px; padding:10px; margin-bottom:15px; box-sizing:border-box; }
.buttons { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
button { height:60px; font-size:22px; border:none; border-radius:12px; cursor:pointer; font-weight:bold; }
.num { background:#333; color:white; }
.op { background:#00ff88; color:black; }
.eq { background:#ff3b30; color:white; grid-column:span 2; }
.clear { background:#555; color:white; }
.share { margin-top:15px; width:100%; background:#25D366; color:white; padding:12px; border-radius:10px; font-size:16px; }
h2{color:white; text-align:center; margin:5px 0 15px 0;}
</style>
</head>
<body>
<div class="box">
<h2>SITUATION MASTER 🔥</h2>
<input type="text" id="display" disabled>
<div class="buttons">
<button class="clear" onclick="clr()">C</button>
<button class="op" onclick="val('%')">%</button>
<button class="op" onclick="back()">⌫</button>
<button class="op" onclick="val('/')">/</button>
<button class="num" onclick="val('7')">7</button>
<button class="num" onclick="val('8')">8</button>
<button class="num" onclick="val('9')">9</button>
<button class="op" onclick="val('*')">x</button>
<button class="num" onclick="val('4')">4</button>
<button class="num" onclick="val('5')">5</button>
<button class="num" onclick="val('6')">6</button>
<button class="op" onclick="val('-')">-</button>
<button class="num" onclick="val('1')">1</button>
<button class="num" onclick="val('2')">2</button>
<button class="num" onclick="val('3')">3</button>
<button class="op" onclick="val('+')">+</button>
<button class="num" onclick="val('0')">0</button>
<button class="num" onclick="val('.')">.</button>
<button class="eq" onclick="calc()">=</button>
</div>
<button class="share" onclick="shareWA()">Share on WhatsApp</button>
</div>
<script>
let d=document.getElementById('display');
function val(v){d.value+=v}
function clr(){d.value=''}
function back(){d.value=d.value.slice(0,-1)}
function calc(){try{d.value=eval(d.value)}catch{d.value='Error'}}
function shareWA(){
let link="https://shaikafzal9140-lang.github.io/Afzal-/";
let msg="Check my Situation Master Calculator 🔥: "+link;
window.open("https://wa.me/?text="+encodeURIComponent(msg), "_blank");
}
</script>
</body>
</html>
